user www-data;
worker_processes 2;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
  	worker_connections 1024; # increase if you have lots of clients
  	accept_mutex on; # set to 'on' if nginx worker_processes > 1
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include    /etc/nginx/mime.types;
	default_type application/octet-stream;

	gzip on;

	upstream admin_api {
		server 172.20.0.9:8000;
	}

	log_format custom '[NGINX] $status $remote_addr - $remote_user [$time_local] "$request" $body_bytes_sent "$http_referer" "$http_user_agent" "$gzip_ratio"';

	server {
		listen 80;
		server_name admin_api;

		if ($scheme != "https") {
			return 301 https://$host$request_uri;
		}
	}

	# -------------------
	# admin_api
	# -------------------
	server {
		listen 8888 ssl http2;
		listen [::]:8888 ssl http2;

		server_name 89.167.26.91;

		ssl_certificate /etc/ssl/certs/cert.crt;
		ssl_certificate_key /etc/ssl/private/cert.key;

		include /etc/nginx/snippets/ssl-params.conf;

		access_log /var/log/nginx/admin_api_access.log custom;
		error_log /var/log/nginx/admin_api_error.log;

		client_max_body_size 25M;  # Adjust based on your needs

		location / {
			proxy_pass http://172.20.0.9:8000;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_redirect off;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			client_max_body_size 50m;
		}
		location /static/ {
			alias /var/cache/admin_api/static/;
		}
		location /serve-media/ {
			internal;
			alias /var/cache/admin_api/media/;
		}
	}

	# -------------------
	# frontend
	# -------------------
	server {
		listen 443 ssl http2;
		listen [::]:443 ssl http2;
		server_name django-admin-adapter-demo.com;

		ssl_certificate /etc/ssl/certs/cert.crt;
		ssl_certificate_key /etc/ssl/private/cert.key;

		include /etc/nginx/snippets/ssl-params.conf;

		access_log /var/log/nginx/frontend_access.log custom;
		error_log /var/log/nginx/frontend_error.log;

		client_max_body_size 25M;  # Adjust based on your needs

		root /var/www/html/frontend;
		index index.html;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# Gzip compression
		gzip on;
		gzip_vary on;
		gzip_min_length 1024;
		gzip_proxied expired no-cache no-store private auth;
		gzip_types
			text/plain
			text/css
			text/xml
			text/javascript
			application/javascript
			application/xml+rss
			application/json;

		# Static assets caching
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
			expires 1y;
			add_header Cache-Control "public, immutable";
			access_log off;
		}

		# React Router fallback - this is crucial for SPAs
		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
