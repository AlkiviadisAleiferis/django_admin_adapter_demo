repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: end-of-file-fixer
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
    - id: ruff
      name: ruff-lint
      args: [ --config, "./pyproject.toml", --fix ]
    - id: ruff-format
      files: src/
      args: [ --config, "./pyproject.toml"]
